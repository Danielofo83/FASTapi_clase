services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres-clase19
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: empresa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_clase19:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empresa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_clase19: